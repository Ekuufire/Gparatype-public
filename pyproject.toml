[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gparatype"
version = "0.2.1"
description = "Architecture-aware research prototype for Glaesserella parasuis capsule/serovar genomic interpretation"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Gparatype project" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gparatype = "gparatype.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gparatype = ["data/GparatypeDB-2026.1-freeze/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
